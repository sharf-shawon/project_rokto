{% extends "base.html" %}

{% load i18n %}

{% block title %}
  {% trans "Response Confirmation" %}
{% endblock title %}
{% block content %}
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 text-center">
        <div class="card shadow-sm border-0">
          <div class="card-body p-5">
            <i class="fas fa-check-circle fa-4x text-success mb-4"></i>
            <h2 class="mb-4">{% trans "Thank You!" %}</h2>
            <p class="lead">{{ message }}</p>
            <hr class="my-4" />
            <a href="{% url 'home' %}" class="btn btn-primary">{% trans "Go to Homepage" %}</a>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock content %}
